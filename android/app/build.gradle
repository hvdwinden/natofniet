plugins {
    id 'com.android.application'
}

// Uploadsleutel voor Google Play (staat niet in de code; zie keystore/keystore.properties)
def ksFile = rootProject.file('keystore/keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'nl.natofnietnat'
    compileSdk 36

    defaultConfig {
        applicationId 'nl.natofnietnat'
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName '2.3.2'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // De webapp in ../web wordt direct als asset meegebundeld
    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Alleen voor de tests op de computer (Android heeft org.json zelf al)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
